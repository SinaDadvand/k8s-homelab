# Multi-tier application - Frontend component
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-app
  namespace: default
  labels:
    app: frontend-app
    tier: frontend
    managed-by: argocd
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend-app
      tier: frontend
  template:
    metadata:
      labels:
        app: frontend-app
        tier: frontend
    spec:
      containers:
      - name: frontend
        image: nginx:alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: frontend-config
          mountPath: /usr/share/nginx/html
          readOnly: true
        resources:
          requests:
            memory: "32Mi"
            cpu: "25m"
          limits:
            memory: "64Mi"
            cpu: "50m"
      volumes:
      - name: frontend-config
        configMap:
          name: frontend-config
---
# Multi-tier application - Backend API component
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-api
  namespace: default
  labels:
    app: backend-api
    tier: backend
    managed-by: argocd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-api
      tier: backend
  template:
    metadata:
      labels:
        app: backend-api
        tier: backend
    spec:
      containers:
      - name: api
        image: httpd:alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: api-config
          mountPath: /usr/local/apache2/htdocs
          readOnly: true
        resources:
          requests:
            memory: "32Mi"
            cpu: "25m"
          limits:
            memory: "64Mi"
            cpu: "50m"
      volumes:
      - name: api-config
        configMap:
          name: api-config
---
# Frontend Service
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: default
  labels:
    app: frontend-app
    tier: frontend
    managed-by: argocd
spec:
  selector:
    app: frontend-app
    tier: frontend
  ports:
  - name: http
    port: 80
    targetPort: 80
    nodePort: 30008
  type: NodePort
---
# Backend API Service
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: default
  labels:
    app: backend-api
    tier: backend
    managed-by: argocd
spec:
  selector:
    app: backend-api
    tier: backend
  ports:
  - name: http
    port: 80
    targetPort: 80
  type: ClusterIP  # Internal service only
