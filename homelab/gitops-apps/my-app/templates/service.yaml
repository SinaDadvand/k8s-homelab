apiVersion: v1
kind: Service
metadata:
  labels:
    app: nginx-my-app
    tag: alpine
  name: my-app-service
  namespace: {{.Values.namespace.name}}
spec:
  ports:
  - port: {{.Values.service.port}}
    protocol: TCP
    targetPort: {{.Values.service.targetPort}}
  selector:
    app: nginx-my-app
    tag: alpine
  type: {{.Values.service.type}}
