apiVersion: v1
kind: ConfigMap
metadata:
  name: my-app-config
  namespace: {{.Values.namespace.name}}
data:
  #{{.Values.configmap.data}}
# Custom nginx configuration - replaces the default nginx.conf
  nginx.conf: |
    # Event processing configuration
    events {
        worker_connections 1024;    # Max connections per worker process
    }
    # HTTP server configuration
    http {
        server {
            listen 80;              # Listen on port 80
            # Main application location
            location / {
                root /usr/share/nginx/html;
                index index.html;
            }
            # Health check endpoint for monitoring and probes
            location /health {
                return 200 "OK\n";
                add_header Content-Type text/plain;
            }
            # Add this location block to return the pod hostname
            location /hostname {
                return 200 $hostname;
                add_header Content-Type text/plain;
            }
            # Add this location block to return the namespace
            location /namespace {
                return 200 "{{.Values.namespace.name}}";
                add_header Content-Type text/plain;
            }
        }
    }
  # Custom HTML content - will replace the default nginx page
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
        <title>Learning Kubernetes!</title>
        <style>
            body { font-family: Arial, sans-serif; margin: 40px; }
            h1 { color: #326ce5; }
        </style>
    </head>
    <body>
        <h1>Hello from Kubernetes!</h1>
        <p>This content is served from a ConfigMap</p>
        <p><strong>Pod:</strong> <span id="podname">Loading...</span></p>
        <p><strong>Namespace:</strong> <span id="namespace">Loading...</span></p>
        <p><em>Configuration as Code in Action!</em></p>
        <script>
            // Fetch the hostname from the /hostname endpoint
            fetch('/hostname')
                .then(response => response.text())
                .then(hostname => {
                    document.getElementById('podname').textContent = hostname;
                })
                .catch(error => {
                    document.getElementById('podname').textContent = "Error fetching hostname";
                });
            
            // Fetch the namespace from the /namespace endpoint
            fetch('/namespace')
                .then(response => response.text())
                .then(namespace => {
                    document.getElementById('namespace').textContent = namespace;
                })
                .catch(error => {
                    document.getElementById('namespace').textContent = "Error fetching namespace";
                });
        </script>
    </body>
    </html>


