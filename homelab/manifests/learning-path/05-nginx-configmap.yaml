apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
data:
  nginx.conf: |
    events {
        worker_connections 1024;
    }
    http {
        server {
            listen 80;
            location / {
                root /usr/share/nginx/html;
                index index.html;
            }
            location /health {
                return 200 "OK\n";
                add_header Content-Type text/plain;
            }
        }
    }
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
        <title>Learning Kubernetes!</title>
    </head>
    <body>
        <h1>Hello from Kubernetes!</h1>
        <p>This is served from a ConfigMap</p>
        <p>Pod: ${HOSTNAME}</p>
    </body>
    </html>