apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-html
  namespace: gitops-demo
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
        <title>GitOps Demo - Nginx App</title>
        <style>
            body { 
                font-family: Arial, sans-serif; 
                margin: 40px; 
                background-color: #f0f8ff;
            }
            .container { 
                max-width: 800px; 
                margin: 0 auto; 
                background: white; 
                padding: 30px; 
                border-radius: 10px; 
                box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            }
            .header { 
                color: #2c3e50; 
                border-bottom: 3px solid #3498db; 
                padding-bottom: 10px;
            }
            .status { 
                background: #e8f5e8; 
                padding: 15px; 
                border-left: 4px solid #27ae60; 
                margin: 20px 0;
            }
            .info { 
                background: #fff3cd; 
                padding: 15px; 
                border-left: 4px solid #ffc107; 
                margin: 20px 0;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h1 class="header">🚀 GitOps Demo Application</h1>
            
            <div class="status">
                <h3>✅ Application Status: Running</h3>
                <p>This application was deployed using GitOps principles with ArgoCD!</p>
            </div>
            
            <div class="info">
                <h3>📚 What is GitOps?</h3>
                <p>GitOps is a way of implementing Continuous Deployment for cloud native applications. It focuses on a developer-centric experience when operating infrastructure, by using tools developers are already familiar with, including Git and Continuous Deployment tools.</p>
                
                <h4>Key GitOps Principles:</h4>
                <ul>
                    <li><strong>Declarative:</strong> The entire system is described declaratively</li>
                    <li><strong>Versioned:</strong> The canonical desired system state is versioned in Git</li>
                    <li><strong>Automated:</strong> Software agents automatically pull the desired state declarations from Git</li>
                    <li><strong>Monitored:</strong> Software agents continuously observe actual system state and attempt to apply the desired state</li>
                </ul>
            </div>
            
            <div class="info">
                <h3>🔄 GitOps Workflow</h3>
                <ol>
                    <li>Developer pushes changes to Git repository</li>
                    <li>ArgoCD detects changes in the Git repository</li>
                    <li>ArgoCD automatically syncs changes to Kubernetes cluster</li>
                    <li>Application state matches the desired state in Git</li>
                </ol>
            </div>
            
            <p><strong>Deployed by:</strong> ArgoCD GitOps Controller</p>
            <p><strong>Namespace:</strong> gitops-demo</p>
            <p><strong>Last Updated:</strong> <span id="timestamp"></span></p>
        </div>
        
        <script>
            document.getElementById('timestamp').textContent = new Date().toLocaleString();
        </script>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-gitops-demo
  namespace: gitops-demo
  labels:
    app: nginx-gitops-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-gitops-demo
  template:
    metadata:
      labels:
        app: nginx-gitops-demo
    spec:
      containers:
      - name: nginx
        image: nginx:1.21
        ports:
        - containerPort: 80
        volumeMounts:
        - name: html-content
          mountPath: /usr/share/nginx/html
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
      volumes:
      - name: html-content
        configMap:
          name: nginx-html
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-gitops-demo-service
  namespace: gitops-demo
spec:
  type: NodePort
  selector:
    app: nginx-gitops-demo
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30090
---
apiVersion: v1
kind: Namespace
metadata:
  name: gitops-demo
  labels:
    name: gitops-demo
---
# ConfigMap with custom HTML content
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-html
  namespace: gitops-demo
  labels:
    app: simple-nginx
    managed-by: argocd
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
        <title>GitOps Demo - ArgoCD</title>
        <style>
            body { font-family: Arial, sans-serif; margin: 40px; background: #f0f8ff; }
            .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
            h1 { color: #2c3e50; text-align: center; }
            .status { background: #d4edda; padding: 15px; border-radius: 5px; margin: 20px 0; }
            .info { background: #d1ecf1; padding: 15px; border-radius: 5px; margin: 20px 0; }
            code { background: #f8f9fa; padding: 2px 4px; border-radius: 3px; }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>🚀 GitOps Demo with ArgoCD</h1>
            
            <div class="status">
                <h3>✅ Application Status</h3>
                <p><strong>Deployment:</strong> Simple Nginx</p>
                <p><strong>Managed by:</strong> ArgoCD</p>
                <p><strong>Namespace:</strong> gitops-demo</p>
                <p><strong>Version:</strong> 1.0.0</p>
            </div>
            
            <div class="info">
                <h3>📚 What is GitOps?</h3>
                <p>GitOps is a way of implementing Continuous Deployment for cloud native applications. It focuses on a developer-centric experience when operating infrastructure, by using tools developers are already familiar with, including Git and Continuous Deployment tools.</p>
                
                <h4>Key Benefits:</h4>
                <ul>
                    <li><strong>Version Control:</strong> All changes tracked in Git</li>
                    <li><strong>Automated Deployment:</strong> ArgoCD handles synchronization</li>
                    <li><strong>Rollback Capability:</strong> Easy to revert to previous versions</li>
                    <li><strong>Audit Trail:</strong> Complete history of all changes</li>
                </ul>
            </div>
            
            <div class="info">
                <h3>🔄 How to Test GitOps</h3>
                <p>Try modifying this HTML content in the ConfigMap and see ArgoCD automatically sync the changes!</p>
                <p><strong>Command:</strong> <code>kubectl edit configmap nginx-html -n gitops-demo</code></p>
            </div>
            
            <div class="status">
                <h3>🎯 Learning Objectives Achieved</h3>
                <ul>
                    <li>✅ Understand GitOps principles</li>
                    <li>✅ Deploy applications with ArgoCD</li>
                    <li>✅ Manage application lifecycle</li>
                    <li>✅ Monitor application state</li>
                </ul>
            </div>
        </div>
    </body>
    </html>
---
# Service to expose the application
apiVersion: v1
kind: Service
metadata:
  name: simple-nginx-service
  namespace: gitops-demo
  labels:
    app: simple-nginx
    managed-by: argocd
spec:
  type: NodePort
  selector:
    app: simple-nginx
  ports:
  - name: http
    port: 80
    targetPort: 80
    nodePort: 30080
